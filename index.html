<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme Dashboard</title>
    <script>
      // Apply the saved theme before first paint so a dark-mode user never
      // sees a flash of the light theme. Keep the storage key in sync with
      // THEME_STORAGE_KEY in src/ThemeContext.jsx.
      (function () {
        try {
          var saved = localStorage.getItem('acme-theme')
          document.documentElement.setAttribute(
            'data-theme',
            saved === 'dark' ? 'dark' : 'light'
          )
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
