<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme Dashboard</title>
    <script>
      // Apply the saved theme before first paint so a dark-mode user does not
      // see a flash of the light theme. Kept in sync with THEME_STORAGE_KEY
      // and THEMES in src/theme.jsx (see the guard test in theme.test.jsx).
      (function () {
        try {
          var stored = window.localStorage.getItem('acme-dashboard-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (error) {
          // Storage unavailable - React applies the default theme on mount.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
